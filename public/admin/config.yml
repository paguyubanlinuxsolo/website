# Decap CMS - Paguyuban Linux Solo
backend:
  name: github
  repo: paguyubanlinuxsolo/website
  branch: main
  # OAuth proxy (Cloudflare Worker, kode di oauth-worker/)
  base_url: https://linuxsolo-decap-oauth.andreasabipermana.workers.dev

# Testing lokal tanpa OAuth: jalankan `npx decap-server` lalu buka /admin/
local_backend: true

# Editorial workflow: tulisan baru masuk sebagai draft (PR di GitHub) dengan
# tahapan Drafts -> In Review -> Ready, baru Publish. Tab "Workflow" muncul di CMS.
publish_mode: editorial_workflow

media_folder: public/images/uploads
public_folder: /images/uploads

locale: id

collections:
  - name: posts
    label: Post
    label_singular: Post
    folder: src/content/posts
    create: true
    slug: '{{slug}}'
    sortable_fields: [pubDate, title]
    fields:
      - { name: title, label: Judul, widget: string }
      - { name: slug, label: Slug (URL), widget: string, hint: 'huruf-kecil-dengan-strip, menentukan alamat /slug/' }
      - { name: pubDate, label: Tanggal terbit, widget: datetime }
      - { name: updatedDate, label: Tanggal diperbarui, widget: datetime, required: false }
      - name: author
        label: Penulis
        widget: relation
        collection: authors
        value_field: name
        search_fields: [name]
        display_fields: [name]
        default: 'Paguyuban Linux Solo'
      - { name: description, label: Deskripsi singkat (SEO & kartu), widget: text, required: false }
      - { name: heroImage, label: Gambar utama, widget: image, required: false }
      - name: categories
        label: Kategori
        widget: select
        multiple: true
        options:
          - { label: Artikel, value: artikel }
          - { label: Event, value: event }
          - { label: Dokumentasi, value: dokumentasi }
        default: [artikel]
      - { name: tags, label: Tag, widget: list, required: false, default: [] }
      - { name: draft, label: Draft (jangan terbitkan), widget: boolean, default: false }
      - { name: body, label: Isi tulisan, widget: markdown }

  - name: pages
    label: Halaman
    label_singular: Halaman
    folder: src/content/pages
    create: true
    slug: '{{slug}}'
    fields:
      - { name: title, label: Judul, widget: string }
      - { name: slug, label: Slug (URL), widget: string }
      - { name: pubDate, label: Tanggal dibuat, widget: datetime }
      - { name: updatedDate, label: Tanggal diperbarui, widget: datetime, required: false }
      - { name: author, label: Penulis, widget: string, default: 'Paguyuban Linux Solo' }
      - { name: description, label: Deskripsi singkat (SEO), widget: text, required: false }
      - { name: heroImage, label: Gambar utama, widget: image, required: false }
      - { name: draft, label: Draft (jangan terbitkan), widget: boolean, default: false }
      - { name: body, label: Isi halaman, widget: markdown }

  - name: authors
    label: Penulis
    label_singular: Penulis
    folder: src/content/authors
    create: true
    slug: '{{slug}}'
    identifier_field: name
    fields:
      - { name: name, label: Nama, widget: string }
      - { name: photo, label: Foto, widget: image, required: false }
      - { name: bio, label: Bio singkat, widget: text, required: false }
      - { name: github, label: Username GitHub, widget: string, required: false }
      - { name: telegram, label: Username Telegram, widget: string, required: false }
      - { name: website, label: Website, widget: string, required: false }
      - { name: body, label: ' ', widget: hidden, default: '' }
